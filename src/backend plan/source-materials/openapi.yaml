components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.codefull.dev/realms/codefull/.well-known/openid-configuration
      description: OIDC with PKCE. Tokens are verified at the API gateway; services trust only gateway-signed internal headers.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
      description: Required on operations whose retry could double an effect.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from a previous page.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      headers:
        RateLimit-Remaining:
          schema:
            type: integer
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            additionalProperties: false
      additionalProperties: false
      required:
      - type
      - title
      - status
    Tier:
      type: string
      enum:
      - beginner
      - intermediate
      - advanced
      - expert
      - master
      - guru
    Language:
      type: string
      enum:
      - python
      - javascript
      - go
      - java
      - cpp
      - rust
    Profile:
      type: object
      properties:
        handle:
          type: string
        display_name:
          type: string
          minLength: 3
          maxLength: 30
        bio:
          type: string
          maxLength: 500
        location:
          type: string
        skills:
          type: array
          items:
            type: string
        tier:
          $ref: '#/components/schemas/Tier'
        xp:
          type: integer
        member_since:
          type: string
          format: date
      additionalProperties: false
      required:
      - handle
      - display_name
      - tier
    ProfileUpdate:
      type: object
      properties:
        display_name:
          type: string
          minLength: 3
          maxLength: 30
        bio:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 100
        skills:
          type: array
          items:
            type: string
      additionalProperties: false
    PrivacySettings:
      type: object
      properties:
        show_on_leaderboard:
          type: boolean
        allow_recruiter_contact:
          type: boolean
        public_challenge_history:
          type: boolean
        show_points_balance:
          type: boolean
      additionalProperties: false
      required:
      - show_on_leaderboard
      - allow_recruiter_contact
      - public_challenge_history
      - show_points_balance
    Onboarding:
      type: object
      properties:
        experience_level:
          type: string
          enum:
          - complete_beginner
          - some_experience
          - professional
        primary_goal:
          type: string
          enum:
          - first_job
          - compete
          - level_up
          - fun
        known_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        weekly_hours:
          type: string
          enum:
          - 1-3
          - 3-7
          - 7-15
          - 15+
      additionalProperties: false
      required:
      - experience_level
      - primary_goal
      - weekly_hours
    DashboardSummary:
      type: object
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        xp_in_tier:
          type: integer
        xp_to_next:
          type: integer
        xp_total:
          type: integer
          description: Sum of XP across tiers
        learning_points:
          type: integer
        prize_points:
          type: integer
        competition_score:
          type: integer
        reputation:
          type: integer
        streak_days:
          type: integer
        challenges_won:
          type: integer
        global_rank:
          type:
          - integer
          - 'null'
      additionalProperties: false
    PublicProfile:
      type: object
