openapi: 3.1.0
info:
  title: CodeFull Public API
  version: 0.2.0
  description: Contract for the CodeFull platform. Derived from SRS-001 and SEC-001. Realtime channels (battles, notifications, run streams) are
    specified separately in AsyncAPI. Errors use RFC 9457 problem details. Every operation lists the requirements it satisfies in x-requirement.
  license:
    name: Proprietary
servers:
- url: https://api.codefull.dev/v1
  description: Production
- url: https://api.staging.codefull.dev/v1
  description: Staging
tags:
- name: Identity
- name: Learning
- name: Execution
- name: Competition
- name: Rewards
- name: Community
- name: AI
- name: Billing
- name: Platform
- name: Admin
security:
- oidc: []
paths:
  /me:
    get:
      operationId: getMe
      summary: Current profile
      tags:
      - Identity
      x-requirement:
      - FR-IDN-004
      - SEC-009
      x-release: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMe
      summary: Update profile
      tags:
      - Identity
      x-requirement:
      - FR-IDN-004
      - SEC-022
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteAccount
      summary: Delete account
      tags:
      - Identity
      x-requirement:
      - FR-IDN-007
      - SEC-075
      - SEC-004
      x-release: MVP
      responses:
        '204':
          description: No content
        '202':
          description: Deletion workflow started
        default:
          $ref: '#/components/responses/Problem'
  /me/summary:
    get:
      operationId: getDashboardSummary
      summary: Dashboard summary
      tags:
      - Identity
      x-requirement:
      - FR-LRN-001
      - FR-RWD-003
      x-release: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        default:
          $ref: '#/components/responses/Problem'
  /me/onboarding:
    put:
      operationId: saveOnboarding
      summary: Save onboarding answers
      tags:
      - Identity
      x-requirement:
      - FR-IDN-003
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Onboarding'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding'
        default:
          $ref: '#/components/responses/Problem'
  /me/settings:
    get:
      operationId: getSettings
      summary: Privacy settings
      tags:
      - Identity
      x-requirement:
      - FR-IDN-005
      - SEC-017
      x-release: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateSettings
      summary: Update privacy settings
      tags:
      - Identity
      x-requirement:
      - FR-IDN-005
      - SEC-017
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        default:
          $ref: '#/components/responses/Problem'
  /me/export:
    post:
      operationId: requestExport
      summary: Request data export
      tags:
      - Identity
      x-requirement:
      - FR-IDN-007
      - SEC-075
      x-release: MVP
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content
        '202':
          description: Export queued
        default:
          $ref: '#/components/responses/Problem'
  /users/{handle}:
    get:
      operationId: getPublicProfile
      summary: Public portfolio
      tags:
      - Identity
      x-requirement:
      - FR-IDN-008
      - SEC-016
      - SEC-017
      x-release: FF
      parameters:
      - name: handle
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /courses:
    get:
      operationId: listCourses
      summary: List courses
      tags:
      - Learning
      x-requirement:
      - FR-LRN-002
      x-release: MVP
      parameters:
      - &id001
        $ref: '#/components/parameters/Cursor'
      - &id002
        $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
        default:
          $ref: '#/components/responses/Problem'
  /courses/{courseId}:
    get:
      operationId: getCourse
      summary: Course detail
      tags:
      - Learning
      x-requirement:
      - FR-LRN-002
      - FR-LRN-003
      x-release: MVP
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        default:
          $ref: '#/components/responses/Problem'
  /courses/{courseId}/enroll:
    post:
      operationId: enrollCourse
      summary: Enroll in course
      tags:
      - Learning
      x-requirement:
      - FR-LRN-002
      x-release: MVP
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Problem'
  /lessons/{lessonId}/progress:
    put:
      operationId: recordLessonProgress
      summary: Record lesson progress
      tags:
      - Learning
      x-requirement:
      - FR-LRN-004
      - FR-LRN-005
      - SEC-021
      x-release: MVP
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonProgressInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgress'
        default:
          $ref: '#/components/responses/Problem'
  /me/progression:
    get:
      operationId: getProgression
      summary: Tier progression and achievements
      tags:
      - Learning
      x-requirement:
      - FR-LRN-001
      - FR-LRN-007
      x-release: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progression'
        default:
          $ref: '#/components/responses/Problem'
  /runs:
    post:
      operationId: createRun
      summary: Run code in the playground
      tags:
      - Execution
      x-requirement:
      - FR-EXE-001
      - FR-EXE-003
      - FR-EXE-006
      - FR-LRN-010
      - SEC-040
      x-release: MVP
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listRuns
      summary: Run history
      tags:
      - Execution
      x-requirement:
      - FR-EXE-007
      x-release: MVP
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{runId}:
    get:
      operationId: getRun
      summary: Run result
      tags:
      - Execution
      x-requirement:
      - FR-EXE-001
      - SEC-010
      x-release: MVP
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/Problem'
  /runs/{runId}/stream:
    get:
      operationId: streamRun
      summary: Stream run output (SSE)
      tags:
      - Execution
      x-requirement:
      - FR-EXE-001
      - NFR-003
      x-release: MVP
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /snippets:
    post:
      operationId: createSnippet
      summary: Save and share a snippet
      tags:
      - Execution
      x-requirement:
      - FR-EXE-004
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnippetCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snippet'
        default:
          $ref: '#/components/responses/Problem'
  /challenges:
    get:
      operationId: listChallenges
      summary: List challenges
      tags:
      - Competition
      x-requirement:
      - FR-CMP-001
      x-release: MVP
      parameters:
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - solo
          - multiplayer
      - name: language
        in: query
        required: false
        schema:
          type: string
      - name: tier
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Tier'
      - name: status
        in: query
        required: false
        schema:
          type: string
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createChallenge
      summary: Create a challenge (moderated)
      tags:
      - Competition
      x-requirement:
      - FR-CMP-004
      x-release: FF
      x-roles:
      - org_admin
      - approved_creator
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        default:
          $ref: '#/components/responses/Problem'
  /challenges/{challengeId}:
    get:
      operationId: getChallenge
      summary: Challenge detail
      tags:
      - Competition
      x-requirement:
      - FR-CMP-001
      x-release: MVP
      parameters:
      - name: challengeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        default:
          $ref: '#/components/responses/Problem'
  /challenges/{challengeId}/entries:
    post:
      operationId: enterChallenge
      summary: Enter a challenge
      tags:
      - Competition
      x-requirement:
      - FR-CMP-002
      - FR-CMP-005
      - FR-EXE-006
      x-release: MVP
      parameters:
      - name: challengeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        default:
          $ref: '#/components/responses/Problem'
  /entries/{entryId}/submissions:
    post:
      operationId: submitSolution
      summary: Submit a solution
      tags:
      - Competition
      x-requirement:
      - FR-CMP-002
      - FR-CMP-003
      - FR-EXE-005
      - SEC-047
      x-release: MVP
      parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        default:
          $ref: '#/components/responses/Problem'
  /submissions/{submissionId}:
    get:
      operationId: getSubmission
      summary: Submission verdict
      tags:
      - Competition
      x-requirement:
      - FR-CMP-003
      - SEC-010
      x-release: MVP
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        default:
          $ref: '#/components/responses/Problem'
  /leaderboards/{scope}:
    get:
      operationId: getLeaderboard
      summary: Leaderboard by scope
      tags:
      - Competition
      x-requirement:
      - FR-CMP-006
      - FR-CMP-007
      - FR-RWD-012
      - SEC-017
      x-release: MVP
      parameters:
      - name: scope
        in: path
        required: true
        schema:
          type: string
          enum:
          - global
          - weekly
          - language
          - region
          - friends
          - org
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        default:
          $ref: '#/components/responses/Problem'
  /me/rank:
    get:
      operationId: getMyRank
      summary: My rank and nearest rivals
      tags:
      - Competition
      x-requirement:
      - FR-CMP-006
      - FR-CMP-014
      x-release: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRank'
        default:
          $ref: '#/components/responses/Problem'
  /me/leaderboard-visibility:
    put:
      operationId: setLeaderboardVisibility
      summary: Show or hide my name
      tags:
      - Competition
      x-requirement:
      - FR-IDN-005
      - FR-CMP-005
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisibilityUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettings'
        default:
          $ref: '#/components/responses/Problem'
  /battles/{battleId}:
    get:
      operationId: getBattle
      summary: Battle info and websocket URL
      tags:
      - Competition
      x-requirement:
      - FR-CMP-008
      - FR-CMP-009
      - SEC-068
      x-release: FF
      parameters:
      - name: battleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleInfo'
        default:
          $ref: '#/components/responses/Problem'
  /rewards/balance:
    get:
      operationId: getBalance
      summary: Points balance by bucket
      tags:
      - Rewards
      x-requirement:
      - FR-RWD-003
      - FR-RWD-011
      - FR-RWD-012
      x-release: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        default:
          $ref: '#/components/responses/Problem'
  /rewards/transactions:
    get:
      operationId: listTransactions
      summary: Points transaction history
      tags:
      - Rewards
      x-requirement:
      - FR-RWD-003
      x-release: MVP
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        default:
          $ref: '#/components/responses/Problem'
  /rewards/catalog:
    get:
      operationId: listCatalog
      summary: Points catalog
      tags:
      - Rewards
      x-requirement:
      - FR-RWD-010
      x-release: MVP
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        default:
          $ref: '#/components/responses/Problem'
  /rewards/catalog/{itemId}/purchase:
    post:
      operationId: purchaseCatalogItem
      summary: Buy a catalog item with points
      tags:
      - Rewards
      x-requirement:
      - FR-RWD-010
      - FR-RWD-011
      - SEC-052
      - SEC-053
      x-release: MVP
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          $ref: '#/components/responses/Problem'
  /me/unlocks:
    get:
      operationId: listUnlocks
      summary: My unlocked items
      tags:
      - Rewards
      x-requirement:
      - FR-RWD-010
      x-release: MVP
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockPage'
        default:
          $ref: '#/components/responses/Problem'
  /pools:
    get:
      operationId: listPools
      summary: Prize pools
      tags:
      - Rewards
      x-requirement:
      - FR-RWD-004
      x-release: FF
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolPage'
        default:
          $ref: '#/components/responses/Problem'
  /redemptions:
    post:
      operationId: createRedemption
      summary: Redeem points
      tags:
      - Rewards
      x-requirement:
      - FR-RWD-006
      - FR-RWD-007
      - FR-RWD-008
      - SEC-054
      - SEC-056
      - SEC-004
      x-release: FF
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionCreate'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Redemption'
        default:
          $ref: '#/components/responses/Problem'
  /questions:
    get:
      operationId: listQuestions
      summary: Community feed
      tags:
      - Community
      x-requirement:
      - FR-COM-001
      - FR-COM-002
      - SEC-018
      x-release: MVP
      parameters:
      - name: tag
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - new
          - top
          - unanswered
      - *id001
      - *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createQuestion
      summary: Ask a question (open or discreet)
      tags:
      - Community
      x-requirement:
      - FR-COM-001
      - FR-COM-002
      - SEC-018
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        default:
          $ref: '#/components/responses/Problem'
  /questions/{questionId}/answers:
    post:
      operationId: createAnswer
      summary: Answer a question
      tags:
      - Community
      x-requirement:
      - FR-COM-003
      x-release: MVP
      parameters:
      - name: questionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        default:
          $ref: '#/components/responses/Problem'
  /answers/{answerId}/accept:
    post:
      operationId: acceptAnswer
      summary: Accept an answer
      tags:
      - Community
      x-requirement:
      - FR-COM-003
      - FR-RWD-002
      x-release: MVP
      parameters:
      - name: answerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Problem'
  /votes:
    post:
      operationId: castVote
      summary: Vote on a question or answer
      tags:
      - Community
      x-requirement:
      - FR-COM-003
      - FR-COM-004
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCreate'
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Problem'
  /flags:
    post:
      operationId: createFlag
      summary: Report content
      tags:
      - Community
      x-requirement:
      - FR-COM-007
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagCreate'
      responses:
        '204':
