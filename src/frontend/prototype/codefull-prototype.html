<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CodeFull — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg: #0C0D10;
  --surface: #13151C;
  --surface2: #1A1D28;
  --surface3: #20243A;
  --border: #252A3D;
  --border2: #2E3450;
  --text: #E8EAF4;
  --text2: #A0A8C8;
  --text3: #6070A0;
  --accent: #14315C;
  --accent2: #2878E7;
  --accent-glow: rgba(29,58,87,0.3);
  --blue: #1D6BDB;
  --yellow: #7AA9EB;
  --orange: #E8630A;
  --green: #22C55E;
  --red: #EF4444;
  --pink: #EC4899;
  --teal: #14B8A6;
  --purple: #3E6B91;
  --gold: #9FCBF2;
  --header-h: 60px;
  --sidebar-w: 240px;
  --sidebar-collapsed: 68px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
html[data-theme="light"] {
  --bg: #F2F3F8;
  --surface: #FFFFFF;
  --surface2: #F0F2FA;
  --surface3: #E8EAFC;
  --border: #DDE0F0;
  --border2: #C8CCE8;
  --text: #1A1D2E;
  --text2: #4A5080;
  --text3: #8890B8;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;transition:background .2s,color .2s}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ============================================================
   TYPOGRAPHY HELPERS
   ============================================================ */
.font-display{font-family:'Space Grotesk',sans-serif}
.font-mono{font-family:'IBM Plex Mono',monospace}
.text-xs{font-size:11px}.text-sm{font-size:12px}.text-base{font-size:14px}.text-lg{font-size:16px}.text-xl{font-size:18px}.text-2xl{font-size:22px}.text-3xl{font-size:28px}.text-4xl{font-size:36px}
.fw-400{font-weight:400}.fw-500{font-weight:500}.fw-600{font-weight:600}.fw-700{font-weight:700}
.text-accent{color:var(--accent2)}.text-blue{color:var(--blue)}.text-yellow{color:var(--yellow)}.text-orange{color:var(--orange)}.text-green{color:var(--green)}.text-red{color:var(--red)}.text-muted{color:var(--text2)}.text-faint{color:var(--text3)}

/* ============================================================
   LAYOUT
   ============================================================ */
.app-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative}
.top-header{height:var(--header-h);flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);z-index:200;position:relative}
.body-area{display:flex;flex:1;overflow:hidden;position:relative;isolation:isolate}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s;position:relative;z-index:20}
.sidebar.collapsed{width:var(--sidebar-collapsed)}
.sidebar-backdrop{position:fixed;top:var(--header-h);left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:250;opacity:0;pointer-events:none;transition:opacity .2s ease}
.sidebar-backdrop.show{opacity:1;pointer-events:auto}
@media (max-width: 860px) {
  .sidebar{
    position:fixed;
    top:var(--header-h);
    left:0;
    bottom:0;
    width:min(78vw,280px);
    max-width:280px;
    z-index:300;
    transform:translateX(-100%);
    transition:transform .25s ease;
  }
  .sidebar.mobile-open{transform:translateX(0);box-shadow:8px 0 24px rgba(0,0,0,.35)}
  .sidebar .collapse-btn{display:none}
  .header-search{display:none}
}
.main-area{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);position:relative;z-index:1;isolation:isolate}
.page{display:none;min-height:100%;width:100%;max-width:100%;min-width:0;overflow:hidden}
.page.active{display:block;width:100%;max-width:100%;min-width:0;overflow:hidden}

.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.03em;white-space:nowrap}
.logo-text .ca{color:var(--blue)}.logo-text .rena{color:var(--text)}
.header-search{flex:1;max-width:480px;margin-left:20px;position:relative}
.header-search input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 36px;font-size:13px;color:var(--text);outline:none;transition:border-color .15s}
.header-search input:focus{border-color:var(--accent)}
.header-search input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3)}
.header-spacer{flex:1}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:none;background:transparent;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--orange);border-radius:50%;border:2px solid var(--surface)}
.theme-toggle{height:30px;width:56px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);position:relative;display:flex;align-items:center;padding:2px}
.theme-knob{width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;transition:transform .2s;font-size:13px}
html[data-theme="dark"] .theme-knob{transform:translateX(0)}
html[data-theme="light"] .theme-knob{transform:translateX(25px)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:#fff;cursor:pointer;flex-shrink:0}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar-scroll{flex:1;overflow-y:auto;padding:10px 8px}
.sidebar-section-label{padding:6px 8px 4px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .sidebar-section-label{opacity:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:none;background:transparent;color:var(--text2);width:100%;text-align:left;font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;position:relative;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(29,58,87,.15);color:var(--accent2)}
.nav-item .nav-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-item .nav-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-item .nav-badge{background:var(--orange);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:999px;flex-shrink:0}
.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-badge,.sidebar.collapsed .sidebar-section-label{display:none}
.sidebar-footer{padding:8px;border-top:1px solid var(--border);flex-shrink:0}
.collapse-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-size:12px;cursor:pointer;transition:all .15s}
.collapse-btn:hover{background:var(--surface2);color:var(--text)}
.sidebar:not(.collapsed) .collapse-btn{justify-content:flex-end}

/* ============================================================
   SHARED UI COMPONENTS
   ============================================================ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent);color:var(--accent2)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{opacity:.88}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{opacity:.88}
.btn-orange{background:var(--orange);color:#fff}.btn-orange:hover{opacity:.88}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-lg{padding:13px 28px;font-size:15px}

/* ============================================================
   MOBILE: STACK CONTENT VERTICALLY (prevents right-side clipping)
   Placed at the end of the stylesheet so these overrides win the
   cascade against the unconditional rules defined above them.
   ============================================================ */
@media (max-width: 860px) {
  /* Any two/three/four-column layout becomes one column */
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .footer-top{grid-template-columns:1fr;gap:28px}
  [style*="grid-template-columns"]:not(.keep-grid){grid-template-columns:1fr !important}

  /* Exceptions that must stay as real grids (code-line-number gutters,
     the year-long activity heatmap) — excluded above via .keep-grid */
  .editor-gutter{height:auto !important;min-height:280px}

  /* Fixed-height "app" pages (Playground, Live Battles, AI Tutor) grow
     to fit their now-stacked content instead of clipping it */
  .tool-shell{height:auto !important;min-height:calc(100vh - 60px)}
  .tool-shell [style*="overflow:hidden"]{overflow:visible !important}
  .tool-shell [style*="overflow-y:auto"]{overflow-y:visible !important}

  /* Wide data tables scroll within their own box instead of
     forcing the whole page wider than the screen */
  table{display:block;overflow-x:auto;white-space:nowrap}

  /* Footer mission/vision panel stacks instead of sitting side by side */
  .footer-mission-box{flex-direction:column}
  .footer-mission-box > div[style*="width:1px"]{display:none}

  /* Tighter page padding on small screens */
  .page-inner{padding:20px 16px}

  /* Safety net: scroll rather than silently clip anything that
     still doesn't fit */
  .page{overflow-x:hidden;overflow-y:auto}
}

</style>

<script>

  // Fix: ensure all .page divs are children of mainArea regardless of parser errors
  (function fixPageParents() {
    const mainArea = document.getElementById('mainArea');
    if (!mainArea) return;
    const allPages = document.querySelectorAll('.page');
    allPages.forEach(pg => {
      if (pg.parentElement !== mainArea) {
        mainArea.appendChild(pg);
      }
    });
    // Also move any modal overlays that ended up misplaced
    document.querySelectorAll('.modal-overlay').forEach(m => {
      if (!document.body.contains(m) || m.parentElement !== document.body) {
        document.body.appendChild(m);
      }
    });
  })();

/* ============================================================
   STATE
   ============================================================ */
let currentPage = 'dashboard';
let sidebarCollapsed = false;

/* ============================================================
   ROUTER
   ============================================================ */
function navigate(pageId) {
  // Hide all pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  // Show target
  const target = document.getElementById('page-' + pageId);
  if (target) {
    target.classList.add('active');
    currentPage = pageId;
  }

  // Update sidebar active state
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.toggle('active', item.dataset.page === pageId);
  });

  // Scroll to top
  const mainArea = document.getElementById('mainArea');
  if (mainArea) mainArea.scrollTop = 0;

  // Auto-close mobile drawer after navigating
  if (window.matchMedia('(max-width: 860px)').matches) closeMobileSidebar();

  // Special page inits
  if (pageId === 'multiplayer') startTimer();
  if (pageId === 'playground') initPlayground();
}

/* ============================================================
   SIDEBAR COLLAPSE
   ============================================================ */
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const isMobile = window.matchMedia('(max-width: 860px)').matches;

  if (isMobile) {
    const backdrop = document.getElementById('sidebarBackdrop');
    const nowOpen = !sidebar.classList.contains('mobile-open');
    sidebar.classList.toggle('mobile-open', nowOpen);
    if (backdrop) backdrop.classList.toggle('show', nowOpen);
    return;
  }

  sidebarCollapsed = !sidebarCollapsed;
  const icon = document.getElementById('collapseIcon');
  const label = document.getElementById('collapseBtnLabel');

  sidebar.classList.toggle('collapsed', sidebarCollapsed);

  if (sidebarCollapsed) {
    icon.innerHTML = '<polyline points="9 18 15 12 9 6"/>';
    if (label) label.style.display = 'none';
  } else {
    icon.innerHTML = '<polyline points="15 18 9 12 15 6"/>';
    if (label) label.style.display = '';
  }
}

function closeMobileSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  if (sidebar) sidebar.classList.remove('mobile-open');
  if (backdrop) backdrop.classList.remove('show');
}

// Reset mobile drawer state when crossing the responsive breakpoint
window.addEventListener('resize', () => {
  if (!window.matchMedia('(max-width: 860px)').matches) closeMobileSidebar();
});

// Close on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMobileSidebar();
});

/* ============================================================
   THEME
   ============================================================ */
function toggleTheme() {
  const html = document.documentElement;
  const icon = document.getElementById('themeIcon');
  if (html.getAttribute('data-theme') === 'dark') {
    html.setAttribute('data-theme', 'light');
    if (icon) icon.textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'dark');
    if (icon) icon.textContent = '☀️';
  }
}

/* ============================================================
   MULTIPLAYER TIMER
   ============================================================ */
let timerInterval = null;
let timerSeconds = 8077; // 2h 14m 37s

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) {
      timerSeconds--;
      const h = Math.floor(timerSeconds / 3600).toString().padStart(2,'0');
      const m = Math.floor((timerSeconds % 3600) / 60).toString().padStart(2,'0');
      const s = (timerSeconds % 60).toString().padStart(2,'0');
      const el = document.getElementById('timer');
      if (el) el.textContent = h + ':' + m + ':' + s;
    } else {
      clearInterval(timerInterval);
      const el = document.getElementById('timer');
      if (el) { el.textContent = 'TIME UP'; el.style.color = 'var(--red)'; }
    }
  }, 1000);
}

/* ============================================================
   PLAYGROUND CODE RUNNER
   ============================================================ */
function runCode() {
  const btn = document.getElementById('runBtn');
  const output = document.getElementById('output');
  if (!output) return;

  btn.textContent = '⏳ Running…';
  btn.disabled = true;
  output.innerHTML = '<span style="color:var(--text3)">Executing in sandbox…</span>';

  setTimeout(() => {
    output.innerHTML = `fib(0) = 0<br>fib(1) = 1<br>fib(2) = 1<br>fib(3) = 2<br>fib(4) = 3<br>fib(5) = 5<br>fib(6) = 8<br>fib(7) = 13<br>fib(8) = 21<br>fib(9) = 34<br><br>Fibonacci sequence complete!<br><span style="color:var(--text3)">━━ Execution: ${Math.floor(Math.random()*20+8)}ms · 2.1MB · Python 3.12 ━━</span>`;
    btn.textContent = '▶ Run';
    btn.disabled = false;
  }, 1200);
}

function initPlayground() {
  // No-op for now — editor is a contenteditable div
}

/* ============================================================
   MODALS
   ============================================================ */
function openModal(id) {
  const overlay = document.getElementById('modal-' + id);
  if (overlay) overlay.classList.add('open');
}

function closeModal(id) {
  const overlay = document.getElementById('modal-' + id);
  if (overlay) overlay.classList.remove('open');
}

// Close modals on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
  }
});

/* ============================================================
   GLOBAL SEARCH — quick nav
   ============================================================ */
const searchInput = document.getElementById('globalSearch');
if (searchInput) {
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = e.target.value.toLowerCase().trim();
      if (!q) return;
      const pageMap = {
        'challenge': 'challenges', 'battle': 'multiplayer', 'live': 'multiplayer',
        'learn': 'learning', 'course': 'courses', 'lesson': 'learning',
        'playground': 'playground', 'code': 'playground', 'editor': 'playground',
        'tournament': 'tournaments', 'leaderboard': 'leaderboard', 'rank': 'leaderboard',
        'reward': 'rewards', 'prize': 'prize-pools', 'point': 'rewards',
        'community': 'community', 'question': 'community', 'mentor': 'mentors',
        'job': 'jobs', 'hire': 'jobs', 'recruit': 'jobs',
        'profile': 'profile', 'portfolio': 'portfolio',
        'dashboard': 'dashboard', 'home': 'dashboard',
        'ai': 'ai-tutor', 'tutor': 'ai-tutor', 'assistant': 'ai-tutor',
        'setting': 'settings', 'privacy': 'settings',
        'billing': 'billing', 'subscription': 'billing', 'plan': 'billing',
        'notification': 'notifications', 'alert': 'notifications',
        'enterprise': 'enterprise', 'team': 'enterprise',
        'analytics': 'analytics', 'stat': 'analytics',
        'admin': 'admin', 'moderate': 'admin',
        'progression': 'progression', 'tier': 'progression', 'xp': 'progression'
      };
      for (const [key, page] of Object.entries(pageMap)) {
        if (q.includes(key)) { navigate(page); e.target.value = ''; return; }
      }
      e.target.value = '';
    }
  });
}

/* ============================================================
   TAB SWITCHING (generic)
   ============================================================ */
document.addEventListener('click', e => {
  if (e.target.classList.contains('tab-btn')) {
    const row = e.target.closest('.tab-row');
    if (row) {
      row.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
    }
  }
});

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', e => {
  // Skip if typing in an input/textarea/contenteditable
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (e.target.contentEditable === 'true') return;

  const shortcuts = {
    'd': 'dashboard', 'p': 'profile', 'l': 'learning',
    'c': 'challenges', 'm': 'multiplayer', 't': 'tournaments',
    'a': 'ai-tutor', 'r': 'rewards', 'n': 'notifications'
  };
  if (!e.ctrlKey && !e.metaKey && !e.altKey && shortcuts[e.key]) {
    navigate(shortcuts[e.key]);
  }

  // / to focus search
  if (e.key === '/') {
    e.preventDefault();
    const search = document.getElementById('globalSearch');
    if (search) search.focus();
  }
});

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  navigate('dashboard');
});


</script>
