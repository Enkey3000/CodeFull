<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Proposed CodeFull code-run flow</title>
  <desc id="desc">A user submits code to an API, the service validates the request, an execution gateway brokers a bounded job to an isolated runtime, and the result is returned as untrusted output for safe display.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2878c8"/></marker>
    <style>
      .bg{fill:#f4f8fd}.box{fill:#fff;stroke:#9cc8f4;stroke-width:2;rx:14}
      .safe{fill:#e9f4ff;stroke:#1674c7;stroke-width:2;rx:14}
      .boundary{fill:#fff4ea;stroke:#de873c;stroke-width:2;rx:14}
      .title{font:700 23px Arial,sans-serif;fill:#12345a}.h{font:700 15px Arial,sans-serif;fill:#12345a}
      .t{font:12px Arial,sans-serif;fill:#35516f}.small{font:12px Arial,sans-serif;fill:#536b84}
      .line{stroke:#2878c8;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="360"/>
  <text class="title" x="40" y="43">Proposed code-run sequence — not implemented in the prototype</text>
  <rect class="box" x="35" y="115" width="170" height="110"/>
  <text class="h" x="58" y="151">Learner client</text><text class="t" x="58" y="180">Code + run request</text>
  <rect class="safe" x="260" y="115" width="185" height="110"/>
  <text class="h" x="283" y="151">API validation</text><text class="t" x="283" y="180">Identity · limits · size</text>
  <rect class="safe" x="505" y="115" width="190" height="110"/>
  <text class="h" x="528" y="151">Execution Gateway</text><text class="t" x="528" y="180">Authorize · broker · track</text>
  <rect class="boundary" x="760" y="95" width="215" height="150"/>
  <text class="h" x="785" y="132">Isolated job boundary</text><text class="t" x="785" y="162">Bounded resources</text><text class="t" x="785" y="188">No network / shared data</text><text class="t" x="785" y="214">Dispose after completion</text>
  <rect class="box" x="1030" y="115" width="145" height="110"/>
  <text class="h" x="1052" y="151">Result API</text><text class="t" x="1052" y="180">Bounded output</text>
  <path class="line" d="M205 170 H260"/><path class="line" d="M445 170 H505"/>
  <path class="line" d="M695 170 H760"/><path class="line" d="M975 170 H1030"/>
  <path class="line" d="M1100 225 C1000 315 320 315 125 225"/>
  <text class="small" x="410" y="297">Return a status and safely rendered, untrusted output; the demo currently only simulates this flow.</text>
  <text class="small" x="40" y="340">This diagram is a target design, not a sandbox deployment guide or security guarantee.</text>
</svg>
